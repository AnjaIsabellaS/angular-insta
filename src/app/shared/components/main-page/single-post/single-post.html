<div class="post">
  <p>Name: {{ post().name }}</p>
  <img class="post-image" [src]="post().img" [alt]="post().name" />
  @if (post().isLiked) {
    <img
      class="heart-icon"
      src="images/heart-red.png"
      alt="Liked"
      (click)="toggleLike()"
    />
  } @else {
    <img
      class="heart-icon"
      src="images/heart-black.png"
      alt="Not liked"
      (click)="toggleLike()"
    />
  }
  <p>Likes: {{ post().Likes }}</p>
  <div class="comments">
  @for (comment of post().comments; track comment.id) {
    <p class="comment"><strong>{{ comment.author }}:</strong> {{ comment.text }}</p>
  }
</div>
</div>
